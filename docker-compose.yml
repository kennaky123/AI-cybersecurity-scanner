services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cybersecurity_backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - SANDBOX_ENABLED=true
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
    shm_size: '512m'
    volumes:
      - ./backend:/app/backend
      - ./ml:/app/ml
      - ./models:/app/models
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cybersecurity_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
